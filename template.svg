<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="40mm" height="16mm" viewBox="0 0 40 16">
  <!-- Vertical guides: 4 mm at each end, which the printer feeds blank itself. Move the right
       one with the page length. Drawn within the guides, the label is the page; drawn beyond
       them, it gets longer, nothing is cut off. No labels on these guides: Inkscape 1.4 on
       Windows crashes on labelled vertical guides next to labelled horizontal ones. -->
  <sodipodi:namedview inkscape:document-units="mm" showguides="true">
    <sodipodi:guide position="0,2" orientation="0,1" inkscape:label="printable band bottom" inkscape:locked="true"/>
    <sodipodi:guide position="0,14" orientation="0,1" inkscape:label="printable band top" inkscape:locked="true"/>
    <sodipodi:guide position="4,0" orientation="1,0" inkscape:locked="true"/>
    <sodipodi:guide position="36,0" orientation="1,0" inkscape:locked="true"/>
  </sodipodi:namedview>
  <g inkscape:groupmode="layer" inkscape:label="Label" id="label"/>
</svg>
