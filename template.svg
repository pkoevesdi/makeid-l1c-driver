<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="1000mm" height="16mm" viewBox="0 0 1000 16">
  <!-- The page is as long as the longest label, so it never needs resizing: blank tape after
       the last dot is not printed. The vertical guide marks the 4 mm the printer feeds blank
       itself; drawn left of it, the label gets longer, nothing is cut off. No label on this
       guide: Inkscape 1.4 on Windows crashes on labelled vertical guides next to labelled
       horizontal ones. -->
  <sodipodi:namedview inkscape:document-units="mm" showguides="true"
                      inkscape:zoom="8" inkscape:cx="50" inkscape:cy="8">
    <sodipodi:guide position="0,2" orientation="0,1" inkscape:label="printable band bottom" inkscape:locked="true"/>
    <sodipodi:guide position="0,14" orientation="0,1" inkscape:label="printable band top" inkscape:locked="true"/>
    <sodipodi:guide position="4,0" orientation="1,0" inkscape:locked="true"/>
  </sodipodi:namedview>
  <g inkscape:groupmode="layer" inkscape:label="Label" id="label"/>
</svg>
